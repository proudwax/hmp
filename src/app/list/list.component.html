@if (data().length) {
  <div tuiCardLarge>
    <section class="list">
      <table tuiTable>
        <thead>
          <tr>
            <th tuiTh></th>
            @for (item of columns().title; track $index) {
              <th tuiTh>{{ item }}</th>
            }
          </tr>
        </thead>
        <tbody tuiTbody>
          @for (item of data(); track $index; let index = $index) {
            <tr>
              <td tuiTd>{{ index + 1 }}.</td>
              @for (value of item; track $index; let i = $index) {
                <td tuiTd>
                  {{ value | tuiFormatNumber: numberFormat }}
                  <small>{{ columns().unit[i] }}</small>
                </td>
              }
            </tr>
          }
        </tbody>
      </table>

      <div class="list__action tui-space_top-4">
        <button
          tuiButton
          size="m"
          type="button"
          appearance="primary"
          (click)="cleared.emit()"
          iconStart="@tui.trash"
        >
          Очистить
        </button>
      </div>
    </section>
  </div>
}
