<form class="tui-container tui-container_adaptive" (submit)="onSave($event)">
  <div tuiGroup>
    @for (input of inputs(); track input.key) {
      <tui-textfield class="tui-group__inherit-item" tuiTextfieldSize="l">
        <input
          [attr.inputmode]="'decimal'"
          tuiInputNumber
          [formField]="input.field"
          [postfix]="input.unit"
        />
      </tui-textfield>
    }
    <button
      class="tui-group__auto-width-item"
      tuiIconButton
      type="submit"
      size="l"
      iconStart="@tui.plus"
      appearance="secondary"
      [disabled]="buttonDisabled()"
    ></button>

    <button
      class="tui-group__auto-width-item"
      tuiIconButton
      type="button"
      size="l"
      iconStart="@tui.x"
      [disabled]="buttonDisabled()"
      (click)="reset()"
    ></button>
  </div>
</form>
