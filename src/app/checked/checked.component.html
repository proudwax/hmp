<section class="tui-container tui-container_adaptive">
  <form class="group">
    <div tuiGroup size="m" class="group" [collapsed]="true">
      @for (item of options; track item.value) {
        <label tuiBlock>
          <input
            tuiRadio
            type="radio"
            [value]="item.value"
            [formField]="form.value"
          />
          {{ item.text }}
        </label>
      }
    </div>
  </form>
</section>
